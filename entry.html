<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Make Entry - Mock Trial Scheduling Assistant</title>
</head>

<body>
    <div class="navbar">
        <img src="images/logo.png" alt="UT Logo" class="logo">
        <h1>Mock Trial Scheduling Assistant</h1>
        <a href="index.html">Home</a>
    </div>

    <div class="entry-page-container">
        <div class="entry-form">
            <h2>Enter Scores</h2>
            
            <form id="scoresForm">

                <!-- Name -->
                <div class="form-group">
                    <label for="personName">Person's Name</label>
                    <input type="text" id="personName" placeholder="Enter full name" required>
                </div>

                <!-- Role Selector -->
                <div class="form-group">
                    <label for="roleSelect">Role</label>
                    <select id="roleSelect" required>
                        <option value="">Select role</option>
                        <option value="attorney">Attorney</option>
                        <option value="witness">Witness</option>
                        <option value="flex">Attorney/Witness</option>
                    </select>
                </div>

                <!-- Attorney -->
                <fieldset class="score-fieldset">
                    <legend>Attorney Scores</legend>

                    <div class="form-group">
                        <label>Opening/Closing</label>
                        <input type="number" id="attorneyOpening" min="0" max="10">
                    </div>

                    <div class="form-group">
                        <label>Direct Exam</label>
                        <input type="number" id="attorneyDirectExam" min="0" max="10">
                    </div>

                    <div class="form-group">
                        <label>Cross Exam</label>
                        <input type="number" id="attorneyCrossExam" min="0" max="10">
                    </div>
                </fieldset>

                <!-- Witness -->
                <fieldset class="score-fieldset">
                    <legend>Witness Scores</legend>

                    <div class="form-group">
                        <label>Direct Exam</label>
                        <input type="number" id="witnessDirectExam" min="0" max="10">
                    </div>

                    <div class="form-group">
                        <label>Cross Exam</label>
                        <input type="number" id="witnessCrossExam" min="0" max="10">
                    </div>
                </fieldset>

                <button type="submit" class="submit-btn">Submit Entry</button>
            </form>
        </div>

        <div class="entries-list-container">
            <h2>Submitted Entries</h2>
            <div id="entriesList" class="entries-list"></div>
        </div>
    </div>

    <script src="scripts/entries.js"></script>
</body>
</html>
